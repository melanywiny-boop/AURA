<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora Hipotecaria</title>

<style>

body{
font-family: Arial;
background:#f3f4f6;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
width:380px;
}

h2{
text-align:center;
margin-bottom:20px;
}

label{
font-weight:bold;
font-size:14px;
}

input, select{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:15px;
border-radius:6px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
background:#0f62fe;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0043ce;
}

.resultado{
margin-top:20px;
padding:15px;
background:#f7f7f7;
border-radius:8px;
font-size:15px;
}

</style>

</head>

<body>

<div class="container">

<h2>Calculadora Hipotecaria</h2>

<label>Moneda</label>
<select id="moneda">
<option value="S/">Soles (S/)</option>
<option value="$">Dólares ($)</option>
</select>

<label>Precio del inmueble</label>
<input type="number" id="precio">

<label>Inicial (%)</label>
<input type="number" id="inicial" value="10">

<label>TCEA anual (%)</label>
<input type="number" id="tcea" value="8">

<label>Seguro de desgravamen (% anual)</label>
<input type="number" id="seguro" value="0.5">

<label>Años del crédito</label>
<input type="number" id="anos" value="20">

<button onclick="calcular()">Calcular</button>

<div class="resultado" id="resultado"></div>

</div>

<script>

function calcular(){

let moneda = document.getElementById("moneda").value;

let precio = parseFloat(document.getElementById("precio").value);
let inicial = parseFloat(document.getElementById("inicial").value)/100;
let tcea = parseFloat(document.getElementById("tcea").value)/100;
let seguro = parseFloat(document.getElementById("seguro").value)/100;
let anos = parseInt(document.getElementById("anos").value);

let inicialMonto = precio * inicial;
let prestamo = precio - inicialMonto;

let tasaMensual = tcea/12;
let meses = anos*12;

let cuota = prestamo * (tasaMensual*Math.pow(1+tasaMensual,meses)) / (Math.pow(1+tasaMensual,meses)-1);

let seguroMensual = prestamo*(seguro/12);

let cuotaTotal = cuota + seguroMensual;

document.getElementById("resultado").innerHTML =

`
Inicial: ${moneda} ${inicialMonto.toFixed(2)} <br><br>

Monto financiado: ${moneda} ${prestamo.toFixed(2)} <br><br>

Cuota mensual crédito: ${moneda} ${cuota.toFixed(2)} <br><br>

Seguro desgravamen: ${moneda} ${seguroMensual.toFixed(2)} <br><br>

<strong>Cuota mensual total: ${moneda} ${cuotaTotal.toFixed(2)}</strong>

`;

}

</script>

</body>
</html>
